{% extends "auth/base.html" %}

{% block title %}Reset Link Sent{% endblock %}

{% block auth_content %}
<div class="login-container">
  <div class="login-right">
    <div class="login-form-wrapper">
      <h2 class="welcome-title">Check Your Email</h2>
      <p class="welcome-subtitle">
        If an active account exists for that email address, a password reset link has been sent.
      </p>
      <a href="{% url 'login' %}" class="forgot-link">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
