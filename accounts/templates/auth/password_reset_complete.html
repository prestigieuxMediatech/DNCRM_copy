{% extends "auth/base.html" %}

{% block title %}Password Updated{% endblock %}

{% block auth_content %}
<div class="login-container">
  <div class="login-right">
    <div class="login-form-wrapper">
      <h2 class="welcome-title">Password Updated</h2>
      <p class="welcome-subtitle">Your password has been changed successfully.</p>
      <a href="{% url 'login' %}" class="forgot-link">Continue to login</a>
    </div>
  </div>
</div>
{% endblock %}
