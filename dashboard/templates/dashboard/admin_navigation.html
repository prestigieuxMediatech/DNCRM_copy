<header class="mycrm-topbar">
    <div class="mycrm-topbar-left">
        <button
            class="mycrm-icon-btn"
            type="button"
            data-mycrm-sidebar-toggle
            aria-label="Toggle sidebar"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="mycrm-topbar-logo">MYCRM</div>
    </div>

    <div class="mycrm-topbar-actions">
        <form method="post" action="{% url 'logout' %}" class="mycrm-logout-form">
            {% csrf_token %}
            <button type="submit" class="mycrm-logout-btn">Logout</button>
        </form>
    </div>
</header>

    <nav class="mycrm-sidebar-nav" aria-label="Admin navigation">
        <a href="{% url 'dashboard:admin_dashboard' %}"

        </a>
