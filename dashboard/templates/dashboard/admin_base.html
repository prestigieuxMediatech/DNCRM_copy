{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MYCRM - Dashboard{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/admin/layout.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    <div class="mycrm-admin">
        {% include "dashboard/admin_navigation.html" %}

        <main class="mycrm-main">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
    {% block js %}
    {% endblock %}
</body>
</html>
